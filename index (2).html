<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Internship Board</title><link rel="stylesheet" href="style.css"></head><body><header><p>FIND YOUR NEXT OPPORTUNITY</p><h1>Explore internships that match your skills.</h1><p>Search opportunities and apply securely.</p></header><main><section class="controls"><label>Search<input id="search" maxlength="80" placeholder="Role, company, skill..."></label><label>Domain<select id="domain"><option>All domains</option><option>AI/ML</option><option>Web Development</option><option>Data Science</option></select></label><button id="retry">Retry</button></section><p id="status">Loading internships…</p><section id="cards" class="cards"></section><section class="application"><h2>Apply for an internship</h2><form id="form"><label>Name<input id="name" required maxlength="80"><small id="nameE"></small></label><label>Email<input id="email" type="email" required maxlength="160"><small id="emailE"></small></label><label>Internship<select id="internshipId" required><option value="">Select an internship</option></select><small id="idE"></small></label><label>Message<textarea id="message" minlength="10" maxlength="1000" required></textarea><small id="msgE"></small></label><button>Submit application</button><p id="formStatus"></p></form></section></main><script src="script.js"></script></body></html>
